query GetUserPosts($userId: Int!, $limit: Int, $cursor: Int) {
  getUserPosts(userId: $userId, limit: $limit, cursor: $cursor) {
    posts {
      id
      content
      postType
      mediaUrls
      likeCount
      isLiked
      commentCount
      shareCount
      createdAt
      user {
        id
        username
        fullName
        avatarUrl
      }
    }
    hasMore
    nextCursor
  }
}
